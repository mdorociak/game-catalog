services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: game_catalog
      POSTGRES_USER: maciek
      POSTGRES_PASSWORD: steam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maciek -d game_catalog"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: